name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dependency install scripts are reviewed and version-pinned in each owning package.json,
# and npm refuses a locked package with an install script that policy does not cover.
env:
  NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the tokens
        uses: actions/checkout@v4

      # Pinned to the version in .nvmrc, which is the version every consuming
      # repository runs.
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check the formatting
        run: npm run format:check

      # Compiles the partial and checks the result is the partial: every literal
      # emitted, nothing declared twice, and the properties reaching a shadow root
      # as well as a document.
      - name: Test the adoption checker
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Run the tests
        run: npm test

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      # The shared layout checks against fixture pages, each built to produce one finding or none.
      - name: Test the layout checks in a browser
        run: npm run test:browser
